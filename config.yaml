# Uptime Monitor Configuration

settings:
  title: "楠霖网站服务监测页"
  logo: "https://nanlin.de5.net/favicon.png" # Optional: URL to your logo image
  callback_url: ""
  callback_secret: ""
  # If true, only send notifications when status changes to DOWN.
  # DEGRADED or UP (recovery) events will NOT trigger notifications.
  notification_on_down_only: true 
  summary_exclusion: ["major_services"]
  tags:
    - id: "zeabur"
      label: "Zeabur"
      color: "#6300FF"
    - id: "eopf"
      label: "EdgeOne Page Function"
      color: "#2563EB"
    - id: "eopage"
      label: "EdgeOne Page"
      color: "#2563EB"
    - id: "esa"
      label: "ESA CDN"
      color: "#EC2626"
    - id: "esapage"
      label: "ESA Page"
      color: "#EC2626"
    - id: "eo"
      label: "EdgeOne CDN"
      color: "#2563EB"
    - id: "cf"
      label: "Cloudflare CDN"
      color: "#D97706"
    - id: "cfw"
      label: "Cloudflare Worker"
      color: "#D97706"
    - id: "cfp"
      label: "Cloudflare Page"
      color: "#D97706"
    - id: "twikoo"
      label: "twikoo-sever"
      color: "#000000"
    - id: "wd"
      label: "WebDav"
      color: "#000000"
    - id: "self"
      label: "Self-Hosted"
      color: "#4B5563"

